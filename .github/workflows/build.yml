name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PACKAGE_NAME: libear-max

jobs:
  macos:
    name: macOS (universal externals + unit tests)
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      # Developer ID signing + notarization (see README "Signing and notarization").
      # All steps that use these are skipped when APPLE_SIGNING_IDENTITY is not set.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # tags are needed for the package version (git describe)
      - name: Install Boost headers
        run: brew install boost
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Import Developer ID certificate into a temporary keychain
        id: signing
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign externals with Developer ID (hardened runtime + timestamp)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -eu
          for bundle in externals/*.mxo; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Notarize and staple externals
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -eu
          KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          ditto -c -k --keepParent externals "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format plist > "$RUNNER_TEMP/notarize.plist"
          STATUS="$(/usr/libexec/PlistBuddy -c 'Print :status' "$RUNNER_TEMP/notarize.plist")"
          echo "notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID="$(/usr/libexec/PlistBuddy -c 'Print :id' "$RUNNER_TEMP/notarize.plist")"
            xcrun notarytool log "$SUBMISSION_ID" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi
          for bundle in externals/*.mxo; do
            xcrun stapler staple "$bundle"
            xcrun stapler validate "$bundle"
          done
          rm -f "$KEY"

      - name: Remove temporary keychain
        if: always() && env.APPLE_SIGNING_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package
        # tar keeps the .mxo bundle permissions and ad-hoc code signature intact
        run: |
          mkdir -p dist/${PACKAGE_NAME}
          cp -R externals help docs package-info.json License.md README.md dist/${PACKAGE_NAME}/
          tar -C dist -czf ${PACKAGE_NAME}-macos.tar.gz ${PACKAGE_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-macos
          path: ${{ env.PACKAGE_NAME }}-macos.tar.gz

  windows:
    name: Windows (x64 externals + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (Boost via vcpkg manifest)
        # no -G: CMake picks the newest installed Visual Studio (the runner image moves between versions)
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${PACKAGE_NAME}
          cp -R externals help docs package-info.json License.md README.md dist/${PACKAGE_NAME}/
          rm -f dist/${PACKAGE_NAME}/externals/*.pdb dist/${PACKAGE_NAME}/externals/*.ilk dist/${PACKAGE_NAME}/externals/*.exp dist/${PACKAGE_NAME}/externals/*.lib
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-windows
          path: dist

  linux:
    name: Linux (unit tests only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Reference pages are committed, current and well-formed XML
        # The unit tests regenerate docs/<name>.maxref.xml from the
        # descriptions in the source (ear_max_doc.h); the committed pages
        # must match, so that the package ships what the source says.
        run: |
          shopt -s nullglob
          files=(docs/*.maxref.xml)
          if [ "${#files[@]}" -ne 9 ]; then
            echo "expected 9 reference pages in docs/, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          python3 tools/check_maxref.py "${files[@]}"
          # git status also catches a page that was generated but never committed
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            git diff -- docs
            echo "::error::docs/ is out of date: run the unit tests and commit the regenerated reference pages"
            exit 1
          fi

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-windows
          path: windows
      - name: Assemble one Max package with the externals of both platforms
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C . -xzf macos/${PACKAGE_NAME}-macos.tar.gz
          cp -R windows/${PACKAGE_NAME}/externals/. ${PACKAGE_NAME}/externals/
          echo "Package contents:"
          find ${PACKAGE_NAME} -maxdepth 2 | sort
          # combined package (macOS .mxo + Windows .mxe64), plus per-platform archives
          zip -r -y -q ${PACKAGE_NAME}-${VERSION}.zip ${PACKAGE_NAME}
          cp macos/${PACKAGE_NAME}-macos.tar.gz ${PACKAGE_NAME}-${VERSION}-macos.tar.gz
          (cd windows && zip -r -q ../${PACKAGE_NAME}-${VERSION}-windows.zip ${PACKAGE_NAME})
          ls -l *.zip *.tar.gz
      - name: Drop package notes left by a previous run of this job
        # The next step appends the package notes to the release body, so a
        # re-run on the same tag would list them twice. Cut the body at the
        # "### Packages" heading first; the release-please changelog above it
        # is kept. Nothing to do when the release does not exist yet. The job
        # has no checkout, so gh is told the repository explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null) \
             && printf '%s\n' "$body" | grep -q '^### Packages'; then
            printf '%s\n' "$body" | sed '/^### Packages/,$d' > release-notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            echo "Removed the package notes of a previous run from the release body"
          fi
      - name: Create or update the release
        # release-please creates the release with the changelog as its notes
        # before dispatching this workflow on the tag; this step attaches the
        # packages and appends the install notes. For a tag pushed by hand it
        # creates the release.
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PACKAGE_NAME }} ${{ github.ref_name }}
          append_body: true
          files: |
            ${{ env.PACKAGE_NAME }}-*.zip
            ${{ env.PACKAGE_NAME }}-*.tar.gz
          body: |
            ### Packages

            Max package with the `ear.objects`, `ear.objects~`, `ear.direct`, `mc.ear.objects~` and `mc.ear.direct~` externals built from libear.

            - `${{ env.PACKAGE_NAME }}-<version>.zip`: combined package for macOS (universal `.mxo`) and Windows (x64 `.mxe64`). Unzip into your `Max 9/Packages` (or `Max 8/Packages`) folder.
            - `-macos.tar.gz` / `-windows.zip`: the same package with only one platform's externals.

            ${{ needs.macos.outputs.signed == 'true' && 'The macOS externals are signed with a Developer ID certificate, notarized by Apple and stapled.' || 'The macOS externals are ad-hoc signed, not notarized. If Max refuses to load them after download, remove the quarantine flag: `xattr -dr com.apple.quarantine "~/Documents/Max 9/Packages/libear-max"`' }}
